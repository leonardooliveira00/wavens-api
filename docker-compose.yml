name: wavensapi

services:
  api:
    build:
      context: ./src/WavensApi
      dockerfile: Dockerfile.dev

    container_name: wavens-api

    restart: unless-stopped

    ports:
      - '3000:8080'

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: true
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wavens;Username=wavens;Password=wavens
      DevelopmentAdmin__Password: ${WAVENS_DEV_ADMIN_PASSWORD}
      Email__Host: ${Email__Host}
      Email__Port: ${Email__Port}
      Email__UseTls: ${Email__UseTls}
      Email__UseAuthentication: ${Email__UseAuthentication}
      Email__SenderEmail: ${Email__SenderEmail}
      Email__SenderName: ${Email__SenderName}
      Frontend__InvitationTokenUrl: ${Frontend__InvitationTokenUrl}
      Frontend__ResetPasswordUrl: ${Frontend__ResetPasswordUrl}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./src/WavensApi:/app
      - dotnet_bin:/app/bin
      - dotnet_obj:/app/obj
      - data_protection_keys:/app/data-protection-keys

  postgres:
    image: postgres:18

    container_name: wavens-postgres

    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_DB: wavens
      POSTGRES_USER: wavens
      POSTGRES_PASSWORD: wavens

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wavens -d wavens']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:18

    environment:
      POSTGRES_DB: wavens_test
      POSTGRES_USER: wavens
      POSTGRES_PASSWORD: wavens

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wavens -d wavens_test']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: wavens-mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025

  integration-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0.404

    working_dir: /workspace

    volumes:
      - .:/workspace
      - integration_api_bin:/workspace/src/WavensApi/bin
      - integration_api_obj:/workspace/src/WavensApi/obj
      - integration_tests_bin:/workspace/tests/WavensApi.IntegrationTests/bin
      - integration_tests_obj:/workspace/tests/WavensApi.IntegrationTests/obj

    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: Host=postgres-test;Port=5432;Database=wavens_test;Username=wavens;Password=wavens
      Frontend__InvitationTokenUrl: ${Frontend__InvitationTokenUrl}
      Frontend__ResetPasswordUrl: ${Frontend__ResetPasswordUrl}

    depends_on:
      postgres-test:
        condition: service_healthy

    command: dotnet test tests/WavensApi.IntegrationTests/WavensApi.IntegrationTests.csproj

volumes:
  postgres_data:
  dotnet_bin:
  dotnet_obj:
  data_protection_keys:
  integration_api_bin:
  integration_api_obj:
  integration_tests_bin:
  integration_tests_obj: